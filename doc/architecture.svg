<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="980" height="480" fill="#ffffff"/>

  <!-- column titles -->
  <text x="115" y="40" text-anchor="middle" font-weight="bold" fill="#222">Host tools</text>
  <text x="255" y="40" text-anchor="middle" font-size="12" fill="#555">TCP, one</text>
  <text x="255" y="54" text-anchor="middle" font-size="12" fill="#555">port per tool</text>
  <text x="400" y="40" text-anchor="middle" font-weight="bold" fill="#222">Bridge</text>
  <text x="765" y="40" text-anchor="middle" font-weight="bold" fill="#222">FPGA</text>

  <!-- host tools -->
  <g stroke-width="2">
    <rect x="20" y="70"  width="190" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="20" y="140" width="190" height="44" rx="6" fill="#d1fae5" stroke="#059669"/>
    <rect x="20" y="210" width="190" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <rect x="20" y="280" width="190" height="44" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
    <rect x="20" y="390" width="190" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="115" y="97">PulseView / sigrok</text>
    <text x="115" y="167">sigrok / Octave</text>
    <text x="115" y="237">BusAccess C / Py / C++</text>
    <text x="115" y="307">IoView</text>
    <text x="115" y="417">one of these tools</text>
  </g>

  <!-- TCP links -->
  <g stroke="#555" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="212" y1="92"  x2="298" y2="92"/>
    <line x1="212" y1="162" x2="298" y2="162"/>
    <line x1="212" y1="232" x2="298" y2="232"/>
    <line x1="212" y1="302" x2="298" y2="302"/>
    <line x1="212" y1="412" x2="298" y2="412"/>
  </g>

  <!-- bridges -->
  <rect x="300" y="70" width="200" height="254" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="400" y="190" text-anchor="middle" font-weight="bold" fill="#222">OpenOCD</text>
  <text x="400" y="210" text-anchor="middle" font-size="12" fill="#444">IPDBG server</text>
  <rect x="300" y="380" width="200" height="64" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="400" y="407" text-anchor="middle" font-weight="bold" fill="#222">UART bridge</text>
  <text x="400" y="427" text-anchor="middle" font-size="12" fill="#444">TCP ↔ serial port</text>

  <!-- physical links -->
  <line x1="502" y1="197" x2="583" y2="197" stroke="#555" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="542" y="187" text-anchor="middle" font-size="12" fill="#555">JTAG</text>
  <line x1="502" y1="412" x2="583" y2="412" stroke="#555" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="542" y="402" text-anchor="middle" font-size="12" fill="#555">UART</text>

  <!-- FPGA -->
  <rect x="565" y="55" width="400" height="405" rx="8" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- JTAG: TAP and hub, several cores -->
  <rect x="585" y="152" width="90" height="90" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="630" y="193" text-anchor="middle" fill="#222">JTAG</text>
  <text x="630" y="211" text-anchor="middle" fill="#222">TAP</text>
  <line x1="675" y1="197" x2="718" y2="197" stroke="#555" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="720" y="152" width="55" height="90" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="747" y="202" text-anchor="middle" fill="#222">Hub</text>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M775,165 C790,165 785,92 798,92"/>
    <path d="M775,185 C790,185 785,162 798,162"/>
    <path d="M775,210 C790,210 785,232 798,232"/>
    <path d="M775,230 C790,230 785,302 798,302"/>
  </g>

  <g stroke-width="2">
    <rect x="800" y="70"  width="150" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="800" y="140" width="150" height="44" rx="6" fill="#d1fae5" stroke="#059669"/>
    <rect x="800" y="210" width="150" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <rect x="800" y="280" width="150" height="44" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="875" y="97">Logic Analyzer</text>
    <text x="875" y="167">Waveform Gen.</text>
    <text x="875" y="237">BusAccess</text>
    <text x="875" y="307">IoProbe</text>
  </g>

  <!-- UART: one core, no hub -->
  <rect x="585" y="382" width="90" height="60" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="630" y="417" text-anchor="middle" fill="#222">UART</text>
  <line x1="675" y1="412" x2="798" y2="412" stroke="#555" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="800" y="390" width="150" height="44" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="875" y="417" text-anchor="middle" fill="#222">one of these cores</text>
</svg>
