# IPDBG demo for the Digilent Cmod S7
#
#   openocd -f demo.cfg
#
# Loads top.bit into the FPGA (volatile, the flash is not touched) and
# starts the IPDBG server on the same ports as the co-simulation.

source [find board/digilent/cmod-s7.cfg]

ipdbg create-hub xc7.ipdbghub -tap xc7.tap -ir 0x02

init

pld load xc7.pld top.bit

xc7.ipdbghub start -tool 0 -port 4242
xc7.ipdbghub start -tool 1 -port 4243
xc7.ipdbghub start -tool 2 -port 4244
xc7.ipdbghub start -tool 3 -port 4245
