<!-- IoView icon: a row of LEDs, one of them on -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="off" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#8a8f8a"/>
      <stop offset="1" stop-color="#3a3d3a"/>
    </radialGradient>
    <radialGradient id="on" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#eaffea"/>
      <stop offset="0.35" stop-color="#5cf05c"/>
