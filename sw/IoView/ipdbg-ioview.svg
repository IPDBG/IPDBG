  <rect x="4" y="38" width="120" height="52" rx="12" fill="#1f3b2a" stroke="#0f1f16" stroke-width="3"/>
  <g stroke="#0f1f16" stroke-width="2">
    <circle cx="23" cy="64" r="12" fill="url(#off)"/>
    <circle cx="107" cy="64" r="12" fill="url(#off)"/>
    <circle cx="79" cy="64" r="12" fill="url(#off)"/>
  </g>
  <circle cx="51" cy="64" r="22" fill="url(#glow)"/>
  <circle cx="51" cy="64" r="12" fill="url(#on)" stroke="#0f1f16" stroke-width="2"/>
