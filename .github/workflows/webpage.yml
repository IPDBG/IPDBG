# Publishes webpage/ to GitHub Pages (ipdbg.org).
# Images come from doc/, so screenshots exist only once in the repo.
name: Webpage
on:
  push:
    branches: [master]
    paths: [webpage/**, doc/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r webpage/. _site/
          cp doc/*.png doc/*.svg _site/
      # One artifact name per attempt, so "Re-run jobs" works as well
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
