# Runs the GHDL checks of rtl/ (rtl/test/run.sh): elaboration of the hub
# variants and all cores, and the self-checking testbenches.
name: GHDL
on:
  push:
    paths: [rtl/**, .github/workflows/ghdl.yml]
  pull_request:
    paths: [rtl/**, .github/workflows/ghdl.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghdl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ghdl/setup-ghdl@v1
        with:
          version: 5.1.1
          backend: mcode
      - name: Run the checks
        run: rtl/test/run.sh
