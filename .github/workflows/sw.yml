# Builds and checks the host software (sw/):
# - linux: builds everything on Ubuntu, loads the bindings, checks make
#   install and make uninstall
# - windows-zip: packs the ZIP for users without MSYS2 (MSYS2 UCRT64,
#   sw/packaging/windows/make-zip.sh) and attaches it to the run as artifact
# - windows-bindings: builds the Python and Octave bindings with MSYS2 and
#   loads them, they are not in the ZIP
# - linux-packages: builds the packages of sw/packaging/obs and
#   sw/packaging/obs in containers of the distributions, installs and checks
#   them; the packages are attached to the run as artifacts
# - python-wheels, python-sdist: the Python package for PyPI (sw/pyproject.toml)
# - release: for a tag v*, if all jobs passed, creates a draft GitHub release
#   with the ZIP. Linux packages are built from the source archive of the tag.
# - pypi: for a tag v*, uploads the Python package to PyPI
name: Host software
on:
  # with tags, branches must be listed too; paths are not checked for tags
  push:
    branches: ['**']
    tags: ['v*']
    paths: [sw/**, LICENSES/**, .github/workflows/sw.yml]
  pull_request:
    paths: [sw/**, LICENSES/**, .github/workflows/sw.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libserialport-dev libwxgtk3.2-dev swig python3-dev octave octave-dev
      - name: Build
        run: make -C sw -j"$(nproc)" all python octave
      - name: Load the bindings
        run: |
          for m in BusAccess WaveformGenerator; do
            export LD_LIBRARY_PATH=$PWD/sw/$m/bin/Release
            (cd sw/$m/python && python3 -c "import $m; print($m.Ipdbg$m())")
            (cd sw/$m/octave && octave-cli --norc --eval "$m; disp(class($m.Ipdbg$m()))")
          done
          sw/UartBridge/bin/Release/UartBridge --version
      - name: Install and uninstall
        run: |
          stage=$PWD/stage
          make -C sw install install-python install-octave PREFIX=/usr DESTDIR="$stage"
          (cd "$stage" && find . ! -type d | sort)
          make -C sw uninstall uninstall-python uninstall-octave PREFIX=/usr DESTDIR="$stage"
          left=$(find "$stage" ! -type d)
          [ -z "$left" ] || { echo "left after uninstall:"; echo "$left"; exit 1; }

  linux-packages:
    name: linux-packages (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: fedora, image: 'fedora:latest', script: obs/ci-rpm.sh}
          - {name: tumbleweed, image: 'opensuse/tumbleweed', script: obs/ci-rpm.sh}
          - {name: leap16, image: 'opensuse/leap:16.0', script: obs/ci-rpm.sh}
          - {name: debian13, image: 'debian:trixie', script: obs/ci-deb.sh}
          - {name: debian12, image: 'debian:bookworm', script: obs/ci-deb.sh}
          - {name: ubuntu2404, image: 'ubuntu:24.04', script: obs/ci-deb.sh}
          - {name: ubuntu2604, image: 'ubuntu:26.04', script: obs/ci-deb.sh}
          - {name: arch, image: 'archlinux:latest', script: obs/ci-arch.sh}
    steps:
      # git and tar for actions/checkout
      - name: Prepare the container
        run: |
          if command -v dnf >/dev/null; then dnf -y install git tar
          elif command -v zypper >/dev/null; then zypper -n install git tar gzip
          elif command -v pacman >/dev/null; then pacman -Syu --noconfirm git
          else apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          fi
      - uses: actions/checkout@v5
      - name: Build, install and check the packages
        run: bash sw/packaging/${{ matrix.script }} out
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.name }}
          path: out/
          include-hidden-files: true

  windows-zip:
    runs-on: windows-latest
    outputs:
      zip: ${{ steps.build.outputs.zip }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libserialport
            mingw-w64-ucrt-x86_64-wxwidgets3.3-msw
      - name: Check the version
        run: |
          version=$(cat sw/VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match sw/VERSION ($version)"
            exit 1
          fi
          # a release (tag) gets the plain version, other builds the commit
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then suffix=; else suffix=g${GITHUB_SHA::7}; fi
          echo "SUFFIX=$suffix" >> "$GITHUB_ENV"
      - name: Build the ZIP
        id: build
        run: |
          zip=$(sw/packaging/windows/make-zip.sh out "$SUFFIX" | tail -1)
          echo "ZIP=$(cygpath -w "$zip")" >> "$GITHUB_ENV"
          echo "zip=$(basename "$zip")" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          # only the DLLs of the ZIP and of Windows in PATH
          dir=$(echo out/stage/ipdbg-*)
          PATH="$dir/bin:/c/Windows/System32" ipdbg-uartbridge.exe --version
          cat "$dir/THIRD-PARTY.txt"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP }}
          archive: false

  windows-bindings:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-swig
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-octave
      - name: Build
        run: make -C sw -j"$(nproc)" python octave
      - name: Python
        run: |
          for m in BusAccess WaveformGenerator; do
            (cd sw/$m/python && python3 -c "import $m; print($m.Ipdbg$m())")
          done
      - name: Octave
        run: |
          for m in BusAccess WaveformGenerator; do
            (cd sw/$m/octave && octave-cli --norc --eval "$m; disp(class($m.Ipdbg$m()))")
          done

  python-wheels:
    name: python-wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: sw
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  python-sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the source archive
        run: pipx run build --sdist sw --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-packages, windows-zip, windows-bindings, python-wheels, python-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.windows-zip.outputs.zip }}
          path: dist
          skip-decompress: true
      # a draft: check the notes on GitHub, then publish it
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --generate-notes --title "IPDBG ${GITHUB_REF_NAME#v}"

  # trusted publishing: PyPI accepts uploads from this workflow and the
  # environment pypi, see sw/packaging/README.md
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
